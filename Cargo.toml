[package]
name = "imping-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
description = "Runtime support for code generated by the imping modding suite: module identity checks, globals and hooks."
publish = false

[dependencies]
# Sibling suite repo, by relative path during development.
imping-hook = { path = "../imping-hook" }
log = "0.4"
# UTF-16 strings behind `WString` and `WStrPtr`.
widestring = "1"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = ["Win32_Globalization", "Win32_System_LibraryLoader"]

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "warn"
